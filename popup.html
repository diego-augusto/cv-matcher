<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>CV Matcher</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 380px; margin: 0; padding: 16px; box-sizing: border-box; background: var(--surface); display: flex; flex-direction: column; gap: 14px; }
  /* aberta como aba (página de opções), em vez de popup */
  .tab body { width: auto; max-width: 640px; margin: 2rem auto; }
  .tab #cv { height: 26rem; }
  header { display: flex; align-items: center; gap: 10px; }
  header .icon-btn { margin: -8px -10px -8px 0; }
  #ready, #setup, .field { display: flex; flex-direction: column; gap: 6px; }
  #setup { gap: 16px; }
  label { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .step { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  input, select, textarea {
    width: 100%; min-height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--field-line); border-radius: 8px;
    font: inherit; color: var(--ink); background: var(--surface);
  }
  textarea { height: 11rem; padding: 10px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; resize: vertical; }
  [aria-invalid="true"] { border: 2px solid var(--error); }
  p { margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #tabTitle { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #existing { padding: 10px 12px; border-radius: 8px; background: var(--soft); font-size: 13px; }
  #summary { border-top: 1px solid var(--line); padding-top: 12px; font-size: 13px; color: var(--muted); }
  #hint { text-align: center; }
  #hint:empty { display: none; }
</style>

<header>
  <img src="icons/icon48.png" width="28" height="28" alt="">
  <span class="brand grow">CV Matcher</span>
  <button id="toggleSetup" class="icon-btn" aria-label="Configurações" aria-controls="setup" hidden>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5" fill="var(--surface)"/><circle cx="15" cy="17" r="2.5" fill="var(--surface)"/></svg>
  </button>
</header>

<section id="ready" hidden>
  <div class="eyebrow">Vaga nesta aba</div>
  <div class="card">
    <div id="tabTitle"></div>
    <div id="tabHost" class="muted small"></div>
  </div>
</section>

<section id="setup" hidden>
  <p class="muted small">Dois passos antes do primeiro currículo. Tudo fica salvo só neste navegador.</p>

  <div class="field">
    <label for="apiKey"><span class="step" aria-hidden="true">1</span>Chave da API da Anthropic</label>
    <input id="apiKey" type="password" placeholder="sk-ant-api…" autocomplete="off" aria-describedby="keyMsg">
    <p id="keyMsg" class="error small" hidden></p>
    <a class="small" href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">Criar chave no Console</a>
  </div>

  <div class="field">
    <label for="model">Modelo</label>
    <select id="model" aria-describedby="modelHelp">
      <option value="claude-opus-5-5" data-price="US$ 4 de entrada e US$ 20 de saída">Opus 5.5 · padrão</option>
      <option value="claude-sonnet-5-5" data-price="US$ 2 de entrada e US$ 10 de saída">Sonnet 5.5 · mais rápido</option>
      <option value="claude-haiku-5-5" data-price="US$ 0,10 de entrada e US$ 0,50 de saída">Haiku 5.5 · mais barato</option>
      <option value="claude-fable-5-2" data-price="US$ 8 de entrada e US$ 40 de saída">Fable 5.2 · mais capaz</option>
    </select>
    <p id="modelHelp" class="muted small"></p>
  </div>

  <div class="field">
    <div class="row">
      <label for="cv" class="grow"><span class="step" aria-hidden="true">2</span>Seu currículo completo</label>
      <span id="saved" class="ok small" role="status" hidden>✓ Salvo</span>
    </div>
    <textarea id="cv" placeholder="Cole aqui tudo: experiências, projetos, skills, formação, contatos. Quanto mais completo, melhor a seleção para cada vaga."></textarea>
    <div class="row muted small">
      <span class="grow">Texto ou Markdown. Cole tudo.</span>
      <span id="cvCount"></span>
    </div>
  </div>
</section>

<button id="generate" class="btn" hidden>Gerar currículo para esta vaga</button>
<p id="hint" class="muted small" role="status"></p>

<div id="existing" class="row" hidden>
  <span class="grow">Já existe um currículo gerado para esta vaga.</span>
  <button id="openExisting" class="link">Abrir</button>
</div>

<div id="summary" class="row" hidden>
  <span id="summaryText" class="grow"></span>
  <button id="change" class="link">Alterar</button>
</div>
<script src="popup.js"></script>
</html>
