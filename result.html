<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>CV Matcher</title>
<style>
  body { font: 11pt/1.4 Georgia, "Times New Roman", serif; color: #111; max-width: 800px; margin: 0 auto; padding: 1rem 2rem 3rem; }
  #bar { font: 14px system-ui, sans-serif; display: flex; gap: .8rem; align-items: center; padding: .8rem 0; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
  #bar button { font: inherit; padding: .4rem 1rem; }
  #status { color: #555; }
  h1 { font-size: 22pt; margin: 0; }
  .headline { font-size: 12pt; margin: .1rem 0; }
  .contact { font-size: 10pt; color: #333; margin: .2rem 0 .8rem; }
  h2 { font-size: 11pt; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid #111; margin: 1rem 0 .4rem; break-after: avoid; }
  .entry { margin-bottom: .6rem; break-inside: avoid; }
  .entry-head { display: flex; justify-content: space-between; gap: 1rem; }
  .entry-head strong { font-size: 11pt; }
  .period { white-space: nowrap; font-size: 10pt; }
  .subtitle { font-style: italic; }
  ul { margin: .2rem 0 0; padding-left: 1.2rem; }
  p { margin: .2rem 0; }
  #sheet { width: 100%; border-collapse: collapse; }
  #sheet td { padding: 0; }
  /* Margem de página zero tira o cabeçalho/rodapé do Chrome (data, título, URL);
     thead/tfoot vazios se repetem em cada folha e devolvem a margem vertical. */
  @page { margin: 0; }
  @media print {
    #bar { display: none; }
    body { padding: 0 1.5cm; max-width: none; }
    #sheet thead td, #sheet tfoot td { height: 1.5cm; }
  }
</style>
<div id="bar">
  <button id="print" hidden>Imprimir / Salvar PDF</button>
  <button id="options">Configurações</button>
  <span id="status" role="status">Carregando…</span>
</div>
<table id="sheet" role="presentation">
  <thead><tr><td></td></tr></thead>
  <tbody><tr><td><main id="cv" contenteditable="true" spellcheck="false"></main></td></tr></tbody>
  <tfoot><tr><td></td></tr></tfoot>
</table>
<script src="result.js"></script>
</html>
