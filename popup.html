<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>CV Matcher</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; width: 380px; margin: 0; padding: 1rem; box-sizing: border-box; }
  /* aberta como aba (página de opções), em vez de popup */
  .tab body { width: auto; max-width: 760px; margin: 2rem auto; }
  .tab textarea { height: 26rem; }
  h1 { font-size: 1.1rem; margin: 0 0 .8rem; }
  label { display: block; font-weight: 600; margin: .9rem 0 .3rem; }
  input, textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: .45rem; }
  textarea { height: 11rem; font-family: ui-monospace, monospace; font-size: 12px; }
  #generate { width: 100%; font: inherit; font-weight: 600; padding: .6rem; cursor: pointer; }
  details { margin-top: 1rem; }
  summary { cursor: pointer; font-weight: 600; }
  small, #status { color: #666; }
  #status { display: block; min-height: 1.4em; margin-top: .4rem; }
</style>
<h1>CV Matcher</h1>

<button id="generate" hidden>Gerar currículo para esta vaga</button>
<span id="status" role="status"></span>

<label for="model">Modelo</label>
<select id="model">
  <option value="claude-opus-5-5">Claude Opus 5.5 — padrão (US$ 4 / 20 por milhão de tokens)</option>
  <option value="claude-sonnet-5-5">Claude Sonnet 5.5 — mais rápido (US$ 2 / 10)</option>
  <option value="claude-haiku-5-5">Claude Haiku 5.5 — mais barato (US$ 0,10 / 0,50)</option>
  <option value="claude-fable-5-2">Claude Fable 5.2 — mais capaz (US$ 8 / 40)</option>
</select>

<details id="setup">
  <summary>Chave da API e currículo</summary>

  <label for="apiKey">Chave da API da Anthropic</label>
  <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
  <small>Fica salva apenas neste navegador e só é enviada para api.anthropic.com.</small>

  <label for="cv">Seu currículo completo (texto ou Markdown)</label>
  <textarea id="cv" placeholder="Cole aqui tudo: experiências, projetos, skills, formação, contatos. Quanto mais completo, melhor a seleção para cada vaga."></textarea>
  <small>Tudo é salvo automaticamente enquanto você digita.</small>
</details>
<script src="popup.js"></script>
</html>
