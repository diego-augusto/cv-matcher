<!doctype html>
<html>
<meta charset="utf-8">
<title>CV Matcher</title>
<link rel="stylesheet" href="ui.css">
<script src="i18n.js"></script>
<style>
  body { width: 380px; margin: 0; padding: 16px; box-sizing: border-box; background: var(--surface); display: flex; flex-direction: column; gap: 14px; }
  /* opened as a tab (options page) instead of the popup */
  .tab body { width: auto; max-width: 640px; margin: 2rem auto; }
  .tab #cv { height: 26rem; }
  header { display: flex; align-items: center; gap: 10px; }
  header .icon-btn { margin: -8px -6px; }
  header select { width: auto; min-height: 36px; padding: 0 6px; font-size: 13px; }
  #ready, #setup, #about, .field { display: flex; flex-direction: column; gap: 6px; }
  #setup { gap: 16px; }
  #about { gap: 12px; }
  #about h2 { margin: 0; font-size: 16px; font-weight: 650; }
  #about .btn { align-self: flex-start; }
  label { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .step { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  input, select, textarea {
    width: 100%; min-height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--field-line); border-radius: 8px;
    font: inherit; color: var(--ink); background: var(--surface);
  }
  textarea { height: 11rem; padding: 10px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; resize: vertical; }
  #instructions { height: 6rem; font: inherit; font-size: 13px; }
  .optional { font-size: 12px; font-weight: 500; color: var(--muted); }
  [aria-invalid="true"] { border: 2px solid var(--error); }
  p { margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #tabTitle { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #existing { padding: 10px 12px; border-radius: 8px; background: var(--soft); font-size: 13px; }
  #summary, #footer { font-size: 13px; color: var(--muted); }
  #history summary { font-size: 13px; font-weight: 600; cursor: pointer; min-height: 32px; display: flex; align-items: center; gap: 6px; list-style: none; }
  #history summary::-webkit-details-marker { display: none; }
  #history summary::before { content: ""; width: 6px; height: 6px; margin: 0 4px 0 2px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .15s; }
  #history[open] summary::before { transform: rotate(45deg); }
  #historyCount { font-weight: 500; }
  .history-item.current { background: var(--soft); }
  #historyList { list-style: none; margin: 4px 0 0; padding: 0; max-height: 14rem; overflow-y: auto; }
  .history-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .history-item:hover, .history-item:focus-visible { background: var(--soft); }
  .history-title { max-width: 100%; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #summary { border-top: 1px solid var(--line); padding-top: 12px; }
  #hint { text-align: center; }
  #hint:empty, .pdf-detail:empty { display: none; }
  header .brand { white-space: nowrap; }
  /* importing a PDF in the popup: only the job, the résumé and the generate button */
  #setup.focus > :not(.cv-field) { display: none; }
  .pdf-detail { display: block; margin-top: 4px; font-size: 12px; opacity: .85; overflow-wrap: anywhere; }
  /* PDF import */
  .pdf-pick { display: flex; align-items: center; gap: 12px; padding: 12px; border: 2px dashed var(--field-line); border-radius: 10px; background: var(--soft); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .pdf-pick:hover:not(:disabled), .pdf-pick.over { border-color: var(--accent); }
  .pdf-pick:disabled { cursor: default; opacity: .7; }
  .pdf-pick-title { font-weight: 650; color: var(--accent); }
  .pdf-stack-tight { display: flex; flex-direction: column; gap: 2px; }
  .pdf-tile { width: 34px; height: 42px; flex-shrink: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; box-sizing: border-box; }
  .small-tile { width: 30px; height: 36px; font-size: 9px; padding-bottom: 5px; }
  .pdf-card { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; border-radius: 10px; }
  .pdf-card .icon-btn { margin: -6px -8px -6px 0; }
  .pdf-min { min-width: 0; }
  .pdf-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pdf-cost { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; background: var(--soft); }
  .pdf-price { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .pdf-warn { padding: 8px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); }
  .pdf-warn:empty { display: none; }
  .pdf-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .pdf-bar div { height: 100%; width: 0; background: var(--accent); transition: width .6s ease; }
  .pdf-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .pdf-steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .pdf-steps li.active { color: var(--ink); font-weight: 600; }
  .pdf-steps li.done { color: var(--ink); }
  .pdf-dot { width: 18px; height: 18px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--field-line); display: inline-flex; align-items: center; justify-content: center; }
  .active .pdf-dot { border-color: var(--line); border-top-color: var(--accent); animation: pdf-spin 1s linear infinite; }
  .done .pdf-dot { border-color: var(--ok); background: var(--ok); }
  .done .pdf-dot::after { content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .pdf-note { padding: 10px 12px; border-radius: 8px; background: var(--soft); }
  .pdf-banner { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 10px; }
  .pdf-banner > svg { flex-shrink: 0; margin-top: 1px; }
  .pdf-ok { background: var(--ok-bg); color: var(--ok); }
  .pdf-error { background: var(--error-bg); color: var(--error); }
  .pdf-ok .link { color: inherit; min-height: 44px; margin: -12px 0; }
  .pdf-or { display: flex; align-items: center; gap: 10px; }
  .pdf-or::before, .pdf-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  #cv.imported { border: 2px solid var(--ok); }
  @keyframes pdf-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .active .pdf-dot { animation: none; } }
</style>

<header>
  <img src="icons/icon48.png" width="28" height="28" alt="">
  <span class="brand grow">CV Matcher</span>
  <select id="lang" data-i18n-aria-label="p.language">
    <option value="pt" lang="pt-BR">Português</option>
    <option value="en" lang="en">English</option>
    <option value="es" lang="es">Español</option>
  </select>
  <button id="expand" class="icon-btn" data-i18n-aria-label="p.expand" hidden>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
  </button>
  <button id="theme" class="icon-btn">
    <svg id="moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg id="sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button id="toggleSetup" class="icon-btn" data-i18n-aria-label="p.settings" aria-controls="setup" hidden>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5" fill="var(--surface)"/><circle cx="15" cy="17" r="2.5" fill="var(--surface)"/></svg>
  </button>
</header>

<section id="ready" hidden>
  <div class="eyebrow" data-i18n="p.jobHere"></div>
  <div class="card">
    <div id="tabTitle"></div>
    <div id="tabHost" class="muted small"></div>
  </div>
</section>

<section id="setup" hidden>
  <p class="muted small" data-i18n="p.intro"></p>

  <div class="field">
    <label for="apiKey"><span class="step" aria-hidden="true">1</span><span data-i18n="p.key"></span></label>
    <input id="apiKey" type="password" placeholder="sk-ant-api…" autocomplete="off" aria-describedby="keyMsg">
    <p id="keyMsg" class="error small" hidden></p>
    <a class="small" href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener" data-i18n="p.createKey"></a>
  </div>

  <div class="field">
    <label for="model" data-i18n="p.model"></label>
    <select id="model" aria-describedby="modelHelp">
      <option value="claude-opus-5-5" data-name="Opus 5.5" data-in="4" data-out="20" data-i18n="m.opus"></option>
      <option value="claude-sonnet-5-5" data-name="Sonnet 5.5" data-in="2" data-out="10" data-i18n="m.sonnet"></option>
      <option value="claude-haiku-5-5" data-name="Haiku 5.5" data-in="0.1" data-out="0.5" data-i18n="m.haiku"></option>
      <option value="claude-fable-5-2" data-name="Fable 5.2" data-in="8" data-out="40" data-i18n="m.fable"></option>
    </select>
    <p id="modelHelp" class="muted small"></p>
  </div>

  <div class="field cv-field">
    <div class="row">
      <label for="cv" class="grow"><span class="step" aria-hidden="true">2</span><span data-i18n="p.cv"></span></label>
      <span id="saved" class="ok small" role="status" data-i18n="p.saved" hidden></span>
    </div>
    <!-- PDF import: data-pdf names the step each block belongs to (idle, selected, reading, done, error).
         The reading runs in background.js, so the popup can close; its progress comes from storage. -->
    <button id="pdfChoose" class="pdf-pick" data-pdf="idle">
      <span class="pdf-tile" aria-hidden="true">PDF</span>
      <span class="pdf-stack-tight">
        <span class="pdf-pick-title" data-i18n="p.pdfTitle"></span>
        <span id="pdfPaid" class="muted small"></span>
      </span>
    </button>

    <div class="card pdf-card" data-pdf="selected">
      <div class="row">
        <span class="pdf-tile small-tile" aria-hidden="true">PDF</span>
        <div class="grow pdf-min"><div class="pdf-name pdf-file"></div><div id="pdfMeta" class="muted small"></div></div>
        <button id="pdfRemove" class="icon-btn" data-i18n-aria-label="p.pdfRemove">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <div class="pdf-cost">
        <div class="row"><span class="eyebrow grow" data-i18n="p.pdfEstimate"></span><span id="pdfEstimate" class="pdf-price"></span></div>
        <p id="pdfCostLine" class="muted small"></p>
      </div>
      <p id="pdfReplace" class="pdf-warn small"></p>
      <div class="row">
        <button id="pdfImport" class="btn grow"></button>
        <button id="pdfCancel" class="btn ghost" data-i18n="p.pdfCancel"></button>
      </div>
    </div>

    <div class="card pdf-card" data-pdf="reading" role="status">
      <div class="row"><span id="pdfImporting" class="pdf-name pdf-min grow"></span><span id="pdfClock" class="muted small"></span></div>
      <div class="pdf-bar"><div id="pdfBar"></div></div>
      <ol id="pdfSteps" class="pdf-steps">
        <li><span class="pdf-dot"></span><span id="pdfStepSend"></span></li>
        <li><span class="pdf-dot"></span><span data-i18n="p.pdfStepRead"></span></li>
        <li><span class="pdf-dot"></span><span id="pdfStepFill"></span></li>
      </ol>
    </div>
    <p id="pdfBackground" class="pdf-note small" data-pdf="reading"></p>
    <button id="pdfAbort" class="btn ghost" data-pdf="reading" data-i18n="p.pdfAbort"></button>

    <div class="pdf-banner pdf-ok" data-pdf="done" role="status">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16 9.5"/></svg>
      <div class="grow small"><strong data-i18n="p.pdfDone"></strong><div id="pdfDoneMeta"></div></div>
      <button id="pdfUndo" class="link small" data-i18n="p.pdfUndo"></button>
    </div>

    <div class="pdf-banner pdf-error small" data-pdf="error" role="alert">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12" y2="16.6"/></svg>
      <div class="grow"><strong id="pdfErrTitle"></strong><div id="pdfErrText"></div><code id="pdfErrDetail" class="pdf-detail"></code></div>
    </div>
    <div class="row" data-pdf="error">
      <button id="pdfRetry" class="btn grow" data-i18n="p.pdfRetry"></button>
      <button id="pdfAnother" class="btn ghost" data-i18n="p.pdfAnother"></button>
    </div>
    <input id="pdfFile" type="file" accept="application/pdf" hidden>

    <div class="pdf-or muted small" data-pdf="idle"><span data-i18n="p.pdfOr"></span></div>
    <textarea id="cv" data-i18n-placeholder="p.cvPlaceholder"></textarea>
    <div class="row muted small">
      <span id="cvHelp" class="grow"></span>
      <span id="cvCount"></span>
    </div>
  </div>

  <div class="field">
    <label for="instructions"><span class="grow" data-i18n="p.instructions"></span><span class="optional" data-i18n="p.optional"></span></label>
    <textarea id="instructions" data-i18n-placeholder="p.instructionsPlaceholder" aria-describedby="instructionsHelp"></textarea>
    <p id="instructionsHelp" class="muted small" data-i18n="p.instructionsHelp"></p>
  </div>
</section>

<section id="about" hidden>
  <h2 data-i18n="a.title"></h2>
  <p id="version" class="eyebrow"></p>
  <p data-i18n="a.why"></p>
  <p data-i18n="a.beta"></p>
  <p data-i18n="a.claude"></p>
  <p data-i18n="a.privacy"></p>
  <p data-i18n="a.review"></p>
  <button id="aboutBack" class="btn ghost" data-i18n="a.back"></button>
</section>

<button id="generate" class="btn" data-i18n="p.generate" hidden></button>
<p id="hint" class="muted small" role="status"></p>

<div id="existing" class="row" hidden>
  <span class="grow" data-i18n="p.existing"></span>
  <button id="openExisting" class="link" data-i18n="p.open"></button>
</div>

<details id="history" hidden>
  <summary><span class="grow" data-i18n="p.history"></span><span id="historyCount" class="muted"></span></summary>
  <ul id="historyList"></ul>
</details>

<div id="summary" class="row" hidden>
  <span id="summaryText" class="grow"></span>
  <button id="change" class="link" data-i18n="p.change"></button>
</div>

<div id="footer" class="row">
  <span id="versionTag" class="grow"></span>
  <button id="aboutLink" class="link" data-i18n="p.about"></button>
</div>
<script type="module" src="popup.js"></script>
</html>
